<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">

<head>
	<meta charset="UTF-8">
	<title>Category</title>
</head>

<body>
	<section>
		<div class="container-fluid p-5">

			<div class="row">
				<div class="col-md-4">
					<a th:href="@{'/admin/add-category'}" class="btn btn-danger mb-3">Add Category</a>
				</div>
			</div>

			<div class="col-md-8">
				<div class="card custom-card-shadow">
					<div class="card-header text-center fs-4">List of Category</div>

					<th:block th:if="${session.successMsg}">
						<p class="text-success fw-bold text-center mt-2">[[${session.successMsg}]]</p>
						<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
					</th:block>
					<th:block th:if="${session.errorMsg}">
						<p class="text-danger fw-bold text-center mt-2">[[${session.errorMsg}]]</p>
						<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
					</th:block>

					<div class="card-body">
						<table class="table">
							<thead>
								<tr>
									<th scope="col">SL No.</th>
									<th scope="col">Category</th>
									<th scope="col">Status</th>
									<th scope="col">Image</th>
									<th scope="col">Date</th>
									<th scope="col">Actions</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="category, count :${allCategoryList}">
									<th scope="row">[[${count.count}]]</th>
									<td>[[${category.categoryName}]]</td>
									<td>[[${category.isActive}]]</td>
									<td><img th:src="@{'/img/category/'+${category.categoryImage}}" width="50px"
											height="50px"></td>
									<td>[[${formattedDateTimeCreatedAt}]]</td>

									<td>
										&nbsp; <a th:href="@{'/admin/edit-category/'+${category.id}}"
											class="btn btn-info btn-sm"><i
												class="fa-solid fa-pen-to-square text-decoration-none"></i></a>&nbsp;
										&nbsp;
										<a th:href="@{'/admin/delete-category/'+${category.id}}"
											class="btn btn-danger btn-sm"><i
												class="fa-solid fa-trash text-decoration-none"></i></a>
									</td>
								</tr>

							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
		</div>
		<script>
			$(document).ready(function () {
				$('#categoryTable').DataTable();
			});

		</script>
	</section>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</body>

</html>
